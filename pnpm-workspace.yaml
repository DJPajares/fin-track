packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - turbo@2.10.11
